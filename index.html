<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillUp · Player login</title>
  <link rel="icon" href="assets/img/icon-basketball-orange.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="auth">
    <h1 class="sr-only">SkillUp</h1>
    <img class="auth-logo" src="assets/img/logo.png" alt="SkillUp" width="519" height="152">
    <p class="tagline">Learn the rules, master the moves, and level up in basketball, volleyball and soccer!</p>

    <form id="login-form" class="auth-card" novalidate>
      <h2>Player login</h2>
      <p class="form-alert" role="alert" hidden></p>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <p class="error"></p>
      </div>

      <div class="field">
        <!-- "Forgot it?" link goes here when password reset is built -->
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        <p class="error"></p>
      </div>

      <label class="check"><input type="checkbox" name="remember"> Keep me logged in</label>

      <button class="btn btn--orange" type="submit">LOG IN &amp; PLAY</button>
    </form>

    <div class="auth-switch">
      <span>New player?</span>
      <a class="btn btn--green" href="signup.html">SIGN UP FREE</a>
    </div>
  </main>

  <script type="module" src="js/presentation/pages/loginPage.js"></script>
</body>
</html>
