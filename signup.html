<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillUp · Join the team</title>
  <link rel="icon" href="assets/img/icon-basketball-orange.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page signup">
  <main class="auth">
    <h1 class="sr-only">SkillUp</h1>
    <img class="auth-logo" src="assets/img/logo.png" alt="SkillUp" width="519" height="152">
    <p class="tagline">Make your player card and start learning basketball, volleyball and soccer for free!</p>

    <form id="signup-form" class="auth-card" novalidate>
      <h2>Join the team!</h2>
      <p class="form-alert" role="alert" hidden></p>

      <div class="field">
        <label for="displayName">Your name</label>
        <input id="displayName" name="displayName" autocomplete="name" placeholder="Jamie Dela Cruz" maxlength="40" required>
        <p class="error"></p>
      </div>

      <div class="field">
        <label for="username">Username</label>
        <div class="input-prefix"><span>@</span>
          <input id="username" name="username" autocomplete="username" placeholder="jamiedc" maxlength="20" required>
        </div>
        <p class="error"></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <p class="error"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
        <p class="error"></p>
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Type it again" required>
        <p class="error"></p>
      </div>

      <button class="btn btn--green" type="submit">SIGN UP &amp; PLAY</button>
    </form>

    <div class="auth-switch">
      <span>Already a player?</span>
      <a class="btn btn--yellow" href="index.html">LOG IN</a>
    </div>
  </main>

  <script type="module" src="js/presentation/pages/signupPage.js"></script>
</body>
</html>
