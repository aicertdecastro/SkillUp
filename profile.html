<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillUp · My profile</title>
  <link rel="icon" href="assets/img/icon-basketball-orange.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body class="prof">
  <div class="app">
    <div class="panel">
      <header class="topbar">
        <a class="back" href="dashboard.html" aria-label="Back to dashboard" id="back"></a>
        <a class="wordmark" href="dashboard.html">SKILL<span>UP</span></a>
        <span class="page-pill">My profile</span>
        <div class="top-actions">
          <button class="btn" type="button" id="edit-btn">Edit profile</button>
          <button class="btn" type="button" id="logout-btn">Log out</button>
        </div>
      </header>

      <main id="content" aria-live="polite">
        <div class="loading">Loading your profile…</div>
      </main>
    </div>
  </div>

  <dialog id="edit-dialog" aria-labelledby="edit-title">
    <form id="edit-form" novalidate>
      <h2 id="edit-title">Edit profile</h2>
      <p class="form-alert" role="alert" hidden></p>
      <div class="field">
        <label for="displayName">Your name</label>
        <input id="displayName" name="displayName" maxlength="40" autocomplete="name" required>
        <p class="error"></p>
      </div>
      <div class="field">
        <label for="username">Username</label>
        <div class="input-prefix"><span>@</span>
          <input id="username" name="username" maxlength="20" autocomplete="username" required>
        </div>
        <p class="error"></p>
      </div>
      <div class="row">
        <button class="btn" type="button" id="cancel-btn">Cancel</button>
        <button class="btn btn--green" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/presentation/pages/profilePage.js"></script>
</body>
</html>
